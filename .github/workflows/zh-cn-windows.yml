name: Simplified Chinese Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zh-cn-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # main only exposes the manual dispatch entry; build the localized branch.
    if: github.ref == 'refs/heads/localization/zh-CN-v1.37.0'
    # Same image and native toolchain as v1.37.0's existing Windows jobs.
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      VCPKG_ROOT: C:/vcpkg
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      PYTHONIOENCODING: utf-8
      # Match upstream CI: dependency checkouts should not emit advisory notes
      # that the project's strict diagnostic wrapper treats as build failures.
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      GIT_CONFIG_KEY_1: advice.detachedHead
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Activate Visual Studio x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio x64 C++ tools not found.' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $env:PATH = "$(Split-Path $vswhere);$env:PATH"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'vcvars64.bat failed.' }

      - name: Validate localization
        shell: pwsh
        run: |
          python -m pip install fonttools==4.61.1
          if ($LASTEXITCODE -ne 0) { throw 'Font checker installation failed.' }
          python scripts/validate_zh_cn.py
          if ($LASTEXITCODE -ne 0) { throw 'Localization validation failed.' }

      - name: Run source-only checks
        shell: pwsh
        run: |
          cmake -S tests/static -B out/static-checks -G Ninja
          if ($LASTEXITCODE -ne 0) { throw 'Static check configuration failed.' }
          ctest --test-dir out/static-checks --build-config Release --output-on-failure --no-tests=error --parallel 8 --output-junit "${{ github.workspace }}/out/static-checks/ctest-results.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Source-only checks failed.' }

      - name: Identify vcpkg toolchain
        id: vcpkg
        shell: pwsh
        run: ./scripts/ci_vcpkg_cache_key.ps1

      - uses: actions/cache@v6
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-windows-x64-v2-${{ steps.vcpkg.outputs.identity }}-${{ hashFiles('vcpkg.json', 'toolchain-x64.cmake', 'cmake/triplets/**') }}
          restore-keys: vcpkg-windows-x64-v2-

      # The browser release URL repeatedly returned HTTP 504 on this runner.
      # Seed the exact FetchContent archive via the release API; CMake still
      # verifies its pinned hash and runs all original unpack/patch commands.
      - name: Fetch pinned SDL_ttf release archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDir = 'out/build/zh-cn-windows/_deps/sdl3_ttf-subbuild/sdl3_ttf-populate-prefix/src'
          $archive = 'SDL3_ttf-3.2.2.tar.gz'
          $expected = '63547d58d0185c833213885b635a2c0548201cc8f301e6587c0be1a67e1e045d'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download release-3.2.2 --repo libsdl-org/SDL_ttf --pattern $archive --dir $downloadDir --clobber
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'Failed to fetch the pinned SDL_ttf archive.' }
            Start-Sleep -Seconds 5
          }
          $actual = (Get-FileHash -LiteralPath (Join-Path $downloadDir $archive) -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'SDL_ttf archive hash differs from the pinned source.' }
          Write-Output "Verified SDL_ttf release archive: $actual"

      - name: Configure player build
        run: >
          python scripts/ci_warnings.py run
          cmake --preset windows-x64
          -B out/build/zh-cn-windows
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain-x64.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets
          -DVCPKG_INSTALLED_DIR=C:/vcpkg/installed
          -DVCPKG_MANIFEST_MODE=ON
          -DENABLE_EDITOR=OFF
          -DENABLE_CONTROL_SOCKET=OFF
          -DMU_WARNINGS_AS_ERRORS=ON
          -DMU_ENABLE_SHADER_COMPILATION=ON
          -DGLSLANG_EXE=C:/vcpkg/installed/x64-windows/tools/glslang/glslangValidator.exe
          -DSPIRV_CROSS_EXE=C:/vcpkg/installed/x64-windows/tools/spirv-cross/spirv-cross.exe
          -DDXC_EXE=C:/vcpkg/installed/x64-windows/tools/directx-dxc/dxc.exe
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: python scripts/ci_warnings.py run cmake --build out/build/zh-cn-windows --config Release

      - name: Run native tests
        run: ctest --test-dir out/build/zh-cn-windows --build-config Release --output-on-failure --no-tests=error --label-exclude static --parallel 4 --output-junit "${{ github.workspace }}/out/build/zh-cn-windows/ctest-results.xml"

      - name: Stage runtime and translated names
        shell: pwsh
        run: |
          $runtime = 'out/build/zh-cn-windows/src/Release'
          $package = 'out/zh-cn-client-update'
          if (Test-Path -LiteralPath $package) { throw 'Refusing to mix a new package with an existing staging directory.' }
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          foreach ($file in @('Main.exe', 'MUnique.Client.Library.dll')) {
            if (-not (Test-Path -LiteralPath "$runtime/$file")) { throw "Missing runtime file: $file" }
            $headers = & dumpbin /headers "$runtime/$file" | Out-String
            if ($LASTEXITCODE -ne 0 -or $headers -notmatch '8664 machine \(x64\)') { throw "Not Windows x64: $file" }
          }
          Copy-Item -Path "$runtime/Main.exe", "$runtime/*.dll" -Destination $package
          Copy-Item -LiteralPath "$runtime/shaders" -Destination $package -Recurse
          $crt = @(Get-ChildItem -LiteralPath "$env:VCToolsRedistDir/x64" -Directory -Filter 'Microsoft.VC*.CRT')
          if ($crt.Count -ne 1) { throw 'Expected one MSVC redistributable CRT directory.' }
          Get-ChildItem -LiteralPath $crt[0].FullName -Filter '*.dll' | Copy-Item -Destination $package
          ./scripts/validate_zh_cn_runtime.ps1 -RuntimeDirectory $package
          New-Item -ItemType Directory -Path "$package/Data/Items", "$package/Data/Monsters" -Force | Out-Null
          $names = @(git diff --name-only v1.37.0 HEAD -- src/bin/Data/Items src/bin/Data/Monsters)
          if ($LASTEXITCODE -ne 0 -or $names.Count -eq 0) { throw 'Unable to identify the translated name files.' }
          foreach ($name in $names) {
            if ($name -notmatch '^src/bin/Data/(Items/Group[0-9]+_[A-Za-z]+\.json|Monsters/Monsters\.json)$') { throw "Unexpected data file: $name" }
            Copy-Item -LiteralPath $name -Destination (Join-Path $package $name.Substring('src/bin/'.Length))
          }
          Copy-Item -LiteralPath 'docs/localization-audit/WINDOWS-UPDATE-README.zh-CN.md' -Destination "$package/README.zh-CN.md"
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -ne $env:GITHUB_SHA) { throw 'Checkout does not match the dispatched commit.' }
          @("source=$source", "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID", 'base=v1.37.0', 'architecture=x64', 'configuration=Release', 'native-build-and-ctest=passed', 'in-game-and-openmu-connection=NOT-TESTED') | Set-Content "$package/localization-build.txt" -Encoding utf8
          Copy-Item -LiteralPath 'out/build/zh-cn-windows/ctest-results.xml' -Destination "$package/ctest-results.xml"
          python scripts/validate_zh_cn_package.py $package
          if ($LASTEXITCODE -ne 0) { throw 'Update package validation failed.' }
          Compress-Archive -Path "$package/*" -DestinationPath 'out/MuMain-v1.37.0-zh-CN-windows-x64-update.zip'
          $zipHash = (Get-FileHash -LiteralPath 'out/MuMain-v1.37.0-zh-CN-windows-x64-update.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  MuMain-v1.37.0-zh-CN-windows-x64-update.zip" | Set-Content out/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: MuMain-v1.37.0-zh-CN-windows-x64-update
          path: |
            out/MuMain-v1.37.0-zh-CN-windows-x64-update.zip
            out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test and configure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zh-cn-windows-diagnostics-${{ github.run_attempt }}
          path: |
            out/static-checks/ctest-results.xml
            out/static-checks/Testing/Temporary/*.log
            out/build/zh-cn-windows/ctest-results.xml
            out/build/zh-cn-windows/Testing/Temporary/*.log
            out/build/zh-cn-windows/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
